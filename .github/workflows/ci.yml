name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Every script compiles (also the ones without tests)
        run: python -m compileall -q -x '(\.venv|build|dist)' .

      - name: Run tests (synthetic data, no network)
        run: >
          pytest -m "not data"
          --cov --cov-report=term --cov-report=xml
          --junitxml=test-results.xml

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  data-tests:
    name: Real MIT-BIH records
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Cache MIT-BIH records (downloaded from PhysioNet)
        uses: actions/cache@v4
        with:
          path: tests/.data/mitdb
          key: mitdb-100-232-v1

      - name: Run tests on real records
        run: pytest -m data

